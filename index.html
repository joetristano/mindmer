<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mindwood — mind maps that grow</title>
<meta name="theme-color" content="#22302A">
<style>
  :root{
    --paper: #EEF1EA;
    --paper-line: #DEE3D5;
    --ink: #22302A;
    --ink-soft: #5B695F;
    --trunk: #4A3324;
    --b1: #2F6F4E;
    --b2: #C98A2C;
    --b3: #7A4FA3;
    --b4: #2E6E8E;
    --b5: #B24C3C;
    --card: #FBFAF6;
    --danger: #B24C3C;
    --focus: #2E6E8E;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{
    height:100%; margin:0; padding:0; overflow:hidden;
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  body{
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  button{ font-family:inherit; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- Top bar ---------- */
  header{
    display:flex; align-items:center; gap:10px;
    padding: 10px 14px; background: rgba(251,250,246,0.92);
    border-bottom: 1px solid var(--paper-line);
    backdrop-filter: blur(6px);
    z-index: 30;
    flex-wrap: nowrap;
  }
  .brand{
    font-family:var(--serif); font-style:italic; font-size:20px;
    color:var(--trunk); white-space:nowrap; margin-right:4px;
    user-select:none;
  }
  .brand b{ font-style:normal; color:var(--b1); }
  .toolbar{ display:flex; gap:6px; flex:1; overflow-x:auto; scrollbar-width:none; }
  .toolbar::-webkit-scrollbar{ display:none; }
  .tbtn{
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    border:1px solid var(--paper-line); background:var(--card); color:var(--ink);
    padding:8px 12px; border-radius:10px; font-size:13.5px; cursor:pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .tbtn:hover{ border-color: var(--ink-soft); }
  .tbtn:active{ transform: scale(0.96); }
  .tbtn svg{ width:16px; height:16px; flex:none; }
  .tbtn.primary{ background:var(--b1); border-color:var(--b1); color:#fff; }
  .tbtn.danger{ color:var(--danger); }
  .tbtn .lbl{ }
  .spacer{ flex:1; }

  /* ---------- Canvas ---------- */
  #viewport{
    position:relative; flex:1; overflow:hidden; touch-action:none;
    cursor: grab;
  }
  #viewport.panning{ cursor: grabbing; }
  #world{
    position:absolute; left:0; top:0;
    width:8000px; height:8000px;
    transform-origin: 0 0;
    will-change: transform;
  }
  svg#edges{ position:absolute; left:0; top:0; width:8000px; height:8000px; overflow:visible; pointer-events:none; }
  svg#edges path{ fill:none; stroke-width:2.5; opacity:.85; stroke-linecap:round; }

  .node{
    position:absolute; transform:translate(-50%,-50%);
    min-width:36px; max-width:240px;
    padding:9px 16px;
    font-size:14px; line-height:1.3;
    color:#fff; background:var(--b1);
    border-radius:10px;
    box-shadow: 0 1px 2px rgba(34,48,42,0.18);
    cursor:pointer; user-select:none;
    border: 2px solid transparent;
    outline:none;
    word-break: break-word;
    text-align:center;
  }
  .node.selected{ box-shadow: 0 0 0 3px rgba(34,48,42,0.18), 0 2px 6px rgba(34,48,42,0.25); }
  .node[contenteditable="true"]{ cursor:text; user-select:text; box-shadow:0 0 0 3px rgba(46,110,142,0.35); }
  .node.dragging{ opacity:.92; }

  .node.depth-0{ font-family:var(--serif); font-style:italic; font-size:17px; background:var(--trunk); }
  .node.shape-circle{ border-radius:50%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; width:120px; height:120px; padding:8px; }
  .node.shape-rounded{ border-radius:999px; }
  .node.shape-square{ border-radius:6px; }
  .node.shape-hexagon{ clip-path: polygon(12% 0%, 88% 0%, 100% 50%, 88% 100%, 12% 100%, 0% 50%); padding:12px 22px; }
  .node.shape-cloud{ border-radius: 46% 54% 62% 38% / 55% 45% 55% 45%; }
  .node.shape-default{ background:transparent; color:var(--ink); border-bottom:2px solid var(--ink-soft); border-radius:0; box-shadow:none; padding:4px 6px; }
  .node.shape-default.selected{ box-shadow:none; border-bottom-color:var(--focus); }

  /* mini contextual toolbar */
  #node-toolbar{
    position:fixed; display:none; gap:4px; z-index:40;
    background:var(--card); border:1px solid var(--paper-line);
    border-radius:12px; padding:5px; box-shadow: 0 6px 18px rgba(34,48,42,0.22);
  }
  #node-toolbar button{
    width:36px; height:36px; border:none; background:transparent; border-radius:8px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
  }
  #node-toolbar button:hover{ background:var(--paper); }
  #node-toolbar button svg{ width:18px; height:18px; }
  #node-toolbar button.danger{ color:var(--danger); }

  /* zoom controls */
  .zoom-controls{
    position:fixed; right:14px; bottom:14px; z-index:25;
    display:flex; flex-direction:column; gap:6px;
    background:var(--card); border:1px solid var(--paper-line);
    border-radius:12px; padding:5px; box-shadow: 0 4px 12px rgba(34,48,42,0.15);
  }
  .zoom-controls button{
    width:38px; height:38px; border:none; background:transparent; border-radius:8px;
    font-size:18px; cursor:pointer; color:var(--ink);
  }
  .zoom-controls button:hover{ background:var(--paper); }
  .zoom-controls hr{ border:none; border-top:1px solid var(--paper-line); margin:2px 4px; }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(34,48,42,0.45); z-index:100;
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:var(--card); border-radius:16px; width:100%; max-width:560px;
    max-height:86vh; display:flex; flex-direction:column; overflow:hidden;
    box-shadow: 0 20px 50px rgba(34,48,42,0.35);
  }
  .modal header{
    background:transparent; border-bottom:1px solid var(--paper-line);
    padding:16px 18px; display:flex; align-items:center;
  }
  .modal h2{ font-family:var(--serif); font-style:italic; font-weight:normal; font-size:19px; margin:0; color:var(--trunk); }
  .modal .close{ margin-left:auto; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); padding:4px 8px; }
  .modal .body{ padding:16px 18px; overflow:auto; }
  .modal .foot{ padding:12px 18px; border-top:1px solid var(--paper-line); display:flex; gap:8px; justify-content:flex-end; }
  .modal p.hint{ color:var(--ink-soft); font-size:13px; margin:0 0 10px; }
  textarea#mermaid-io{
    width:100%; min-height:260px; resize:vertical; font-family:var(--mono); font-size:13px;
    padding:12px; border-radius:10px; border:1px solid var(--paper-line); background:#fff; color:var(--ink);
    line-height:1.5;
  }
  .modal .foot .tbtn{ }

  /* ---------- Empty / responsive ---------- */
  @media (max-width: 640px){
    .brand{ font-size:17px; }
    .tbtn .lbl{ display:none; }
    .tbtn{ padding:9px; }
    header{ padding:8px 10px; gap:6px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Mind<b>wood</b></div>
    <div class="toolbar">
      <button class="tbtn" id="btn-new" title="New map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span class="lbl">New</span>
      </button>
      <button class="tbtn" id="btn-import" title="Import Mermaid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
        <span class="lbl">Import</span>
      </button>
      <button class="tbtn" id="btn-export" title="Export Mermaid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></svg>
        <span class="lbl">Export</span>
      </button>
      <button class="tbtn" id="btn-fit" title="Fit to screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="lbl">Fit</span>
      </button>
      <button class="tbtn" id="btn-relayout" title="Tidy layout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4M3 6h7M3 18h7M14 6h7M14 18h7M14 12h7M11 6v12"/></svg>
        <span class="lbl">Tidy</span>
      </button>
    </div>
  </header>

  <div id="viewport">
    <div id="world">
      <svg id="edges"></svg>
      <div id="nodes-layer"></div>
    </div>
  </div>

  <div id="node-toolbar">
    <button data-act="edit" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button data-act="child" title="Add child"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h9M4 6h5M4 18h5M19 9v10M15 14h8"/></svg></button>
    <button data-act="sibling" title="Add sibling"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v18M6 8h6M6 16h6M18 5v6M18 15v4"/></svg></button>
    <button data-act="delete" class="danger" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0 1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13"/></svg></button>
  </div>

  <div class="zoom-controls">
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-out" title="Zoom out">−</button>
    <hr>
    <button id="zoom-reset" title="Reset zoom" style="font-size:13px;">1:1</button>
  </div>
</div>

<!-- Import modal -->
<div class="modal-backdrop" id="import-backdrop">
  <div class="modal">
    <header><h2>Import Mermaid</h2><button class="close" data-close>&times;</button></header>
    <div class="body">
      <p class="hint">Paste a Mermaid <code>mindmap</code> diagram below. This replaces your current map.</p>
      <textarea id="import-text" spellcheck="false" placeholder="mindmap
  root((Central idea))
    Branch one
      Detail
    Branch two"></textarea>
    </div>
    <div class="foot">
      <button class="tbtn" data-close>Cancel</button>
      <button class="tbtn primary" id="btn-do-import">Import</button>
    </div>
  </div>
</div>

<!-- Export modal -->
<div class="modal-backdrop" id="export-backdrop">
  <div class="modal">
    <header><h2>Export Mermaid</h2><button class="close" data-close>&times;</button></header>
    <div class="body">
      <p class="hint">Copy this into any Mermaid-compatible tool, or download it as a file.</p>
      <textarea id="export-text" spellcheck="false" readonly></textarea>
    </div>
    <div class="foot">
      <button class="tbtn" id="btn-download">Download .mmd</button>
      <button class="tbtn primary" id="btn-copy">Copy</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "mindwood.map.v1";
  var WC = { x: 4000, y: 4000 }; // world center anchor
  var X_GAP = 170, LEAF_GAP = 58;
  var BRANCH_COLORS = ["#2F6F4E","#C98A2C","#7A4FA3","#2E6E8E","#B24C3C"];

  var state = null; // { nodes, rootId, nextIdNum }
  var view = { panX:0, panY:0, scale:1 };
  var selectedId = null;
  var saveTimer = null;

  var viewport = document.getElementById("viewport");
  var world = document.getElementById("world");
  var edgesSvg = document.getElementById("edges");
  var nodesLayer = document.getElementById("nodes-layer");
  var nodeToolbar = document.getElementById("node-toolbar");

  // ---------------- Data helpers ----------------
  function defaultState(){
    var nodes = {};
    nodes["n0"] = { id:"n0", text:"Central idea", shape:"circle", x:0, y:0, parent:null, children:["n1","n2"] };
    nodes["n1"] = { id:"n1", text:"First branch", shape:"rounded", x:0, y:0, parent:"n0", children:[] };
    nodes["n2"] = { id:"n2", text:"Second branch", shape:"rounded", x:0, y:0, parent:"n0", children:[] };
    return { nodes:nodes, rootId:"n0", nextIdNum:3 };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.nodes || !parsed.rootId) return defaultState();
      if(parsed.view) view = parsed.view;
      return { nodes: parsed.nodes, rootId: parsed.rootId, nextIdNum: parsed.nextIdNum || (Object.keys(parsed.nodes).length+1) };
    }catch(e){
      console.warn("Mindwood: could not read saved map, starting fresh.", e);
      return defaultState();
    }
  }

  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ nodes: state.nodes, rootId: state.rootId, nextIdNum: state.nextIdNum, view: view }));
      }catch(e){ console.warn("Mindwood: could not save map (storage may be full).", e); }
    }, 250);
  }

  function newId(){ var id = "n"+state.nextIdNum; state.nextIdNum++; return id; }

  function addChild(parentId, text){
    var id = newId();
    state.nodes[id] = { id:id, text: text || "New idea", shape:"rounded", x:0, y:0, parent: parentId, children:[] };
    state.nodes[parentId].children.push(id);
    return id;
  }

  function addSibling(nodeId, text){
    var node = state.nodes[nodeId];
    if(!node.parent) return addChild(nodeId, text); // root has no siblings
    var id = addChild(node.parent, text);
    var siblings = state.nodes[node.parent].children;
    siblings.splice(siblings.indexOf(id), 1);
    siblings.splice(siblings.indexOf(nodeId)+1, 0, id);
    return id;
  }

  function collectSubtreeIds(id, out){
    out = out || [];
    out.push(id);
    state.nodes[id].children.forEach(function(cid){ collectSubtreeIds(cid, out); });
    return out;
  }

  function deleteNode(id){
    var node = state.nodes[id];
    if(!node || !node.parent) return false; // can't delete root
    var parent = state.nodes[node.parent];
    parent.children.splice(parent.children.indexOf(id), 1);
    var toRemove = collectSubtreeIds(id);
    toRemove.forEach(function(rid){ delete state.nodes[rid]; });
    if(toRemove.indexOf(selectedId) !== -1) selectNode(null);
    return true;
  }

  function depthOf(id){
    var d = 0, node = state.nodes[id];
    while(node.parent){ d++; node = state.nodes[node.parent]; }
    return d;
  }

  // ---------------- Layout ----------------
  function layoutTree(){
    var root = state.nodes[state.rootId];
    root.x = 0; root.y = 0;
    var kids = root.children;
    var rightIds = [], leftIds = [];
    kids.forEach(function(id, i){ (i % 2 === 0 ? rightIds : leftIds).push(id); });
    layoutSide(rightIds, 1);
    layoutSide(leftIds, -1);
  }

  function layoutSide(ids, sign){
    if(ids.length === 0) return;
    var cursor = { y: 0 };
    ids.forEach(function(id){ layoutSubtree(id, 1, sign, cursor); });
    var all = [];
    ids.forEach(function(id){ collectSubtreeIds(id, all); });
    var ys = all.map(function(id){ return state.nodes[id].y; });
    var mid = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
    all.forEach(function(id){ state.nodes[id].y -= mid; });
  }

  function layoutSubtree(id, depth, sign, cursor){
    var node = state.nodes[id];
    node.x = sign * depth * X_GAP;
    if(node.children.length === 0){
      node.y = cursor.y;
      cursor.y += LEAF_GAP;
      return node.y;
    }
    var firstY = null, lastY = null;
    node.children.forEach(function(cid){
      var y = layoutSubtree(cid, depth+1, sign, cursor);
      if(firstY === null) firstY = y;
      lastY = y;
    });
    node.y = (firstY + lastY) / 2;
    return node.y;
  }

  // ---------------- Rendering ----------------
  function fullRender(){
    nodesLayer.innerHTML = "";
    edgesSvg.innerHTML = "";
    Object.keys(state.nodes).forEach(function(id){
      var node = state.nodes[id];
      if(node.parent){
        var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("data-child", id);
        path.setAttribute("stroke", colorForDepthResolved(depthOf(id)));
        edgesSvg.appendChild(path);
      }
    });
    Object.keys(state.nodes).forEach(function(id){
      nodesLayer.appendChild(buildNodeEl(id));
    });
    Object.keys(state.nodes).forEach(updateEdgesFor);
    applyTransform();
    positionNodeToolbar();
  }

  function colorForDepthResolved(d){
    if(d === 0) return "#4A3324";
    return BRANCH_COLORS[(d-1) % BRANCH_COLORS.length];
  }

  function buildNodeEl(id){
    var node = state.nodes[id];
    var d = depthOf(id);
    var el = document.createElement("div");
    el.className = "node depth-"+d+" shape-"+node.shape + (id === selectedId ? " selected" : "");
    el.dataset.id = id;
    el.textContent = node.text;
    if(node.shape !== "default" && d !== 0){
      el.style.background = colorForDepthResolved(d);
    }
    if(d === 0){ el.style.background = "#4A3324"; }
    if(node.shape === "default"){ el.style.color = colorForDepthResolved(d); el.style.borderBottomColor = colorForDepthResolved(d); el.style.background="transparent"; }
    positionNodeEl(el, node);
    return el;
  }

  function positionNodeEl(el, node){
    el.style.left = (WC.x + node.x) + "px";
    el.style.top = (WC.y + node.y) + "px";
  }

  function edgeD(px, py, cx, cy){
    var midX = px + (cx - px) / 2;
    return "M "+px+" "+py+" C "+midX+" "+py+", "+midX+" "+cy+", "+cx+" "+cy;
  }

  function updateEdgesFor(id){
    var node = state.nodes[id];
    if(node.parent){
      var parent = state.nodes[node.parent];
      var path = edgesSvg.querySelector('path[data-child="'+id+'"]');
      if(path){
        path.setAttribute("d", edgeD(WC.x+parent.x, WC.y+parent.y, WC.x+node.x, WC.y+node.y));
      }
    }
    node.children.forEach(function(cid){
      var cpath = edgesSvg.querySelector('path[data-child="'+cid+'"]');
      if(cpath){
        cpath.setAttribute("d", edgeD(WC.x+node.x, WC.y+node.y, WC.x+state.nodes[cid].x, WC.y+state.nodes[cid].y));
      }
    });
  }

  function moveNodeLive(id, dx, dy){
    var node = state.nodes[id];
    node.x += dx; node.y += dy;
    var el = nodesLayer.querySelector('.node[data-id="'+id+'"]');
    if(el) positionNodeEl(el, node);
    updateEdgesFor(id);
    positionNodeToolbar();
  }

  function applyTransform(){
    world.style.transform = "translate("+view.panX+"px,"+view.panY+"px) scale("+view.scale+")";
  }

  // ---------------- Selection & mini toolbar ----------------
  function selectNode(id){
    var prev = nodesLayer.querySelector(".node.selected");
    if(prev) prev.classList.remove("selected");
    selectedId = id;
    if(id){
      var el = nodesLayer.querySelector('.node[data-id="'+id+'"]');
      if(el) el.classList.add("selected");
    }
    positionNodeToolbar();
  }

  function positionNodeToolbar(){
    if(!selectedId || !state.nodes[selectedId]){ nodeToolbar.style.display = "none"; return; }
    var node = state.nodes[selectedId];
    var vpRect = viewport.getBoundingClientRect();
    var screenX = vpRect.left + view.panX + (WC.x+node.x) * view.scale;
    var screenY = vpRect.top + view.panY + (WC.y+node.y) * view.scale;
    nodeToolbar.style.display = "flex";
    var tw = nodeToolbar.offsetWidth || 170, th = nodeToolbar.offsetHeight || 46;
    var left = Math.min(Math.max(screenX - tw/2, 6), window.innerWidth - tw - 6);
    var top = screenY - th - 46;
    if(top < 50) top = screenY + 46;
    nodeToolbar.style.left = left + "px";
    nodeToolbar.style.top = top + "px";
  }

  // ---------------- Editing ----------------
  function beginEdit(id){
    var el = nodesLayer.querySelector('.node[data-id="'+id+'"]');
    if(!el) return;
    el.setAttribute("contenteditable", "true");
    el.focus();
    document.execCommand && document.execCommand("selectAll", false, null);
    var range = document.createRange();
    range.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  }

  function commitEdit(el){
    var id = el.dataset.id;
    var node = state.nodes[id];
    if(!node) return;
    el.removeAttribute("contenteditable");
    var text = el.textContent.replace(/\s+/g," ").trim() || "Untitled";
    node.text = text;
    el.textContent = text;
    saveState();
  }

  // ---------------- Pointer interactions ----------------
  var drag = null; // {type:'node'|'pan', id, startX, startY, lastX, lastY, moved}
  var pointers = new Map();
  var pinch = null; // {startDist, startScale, startPanX, startPanY, midX, midY}

  function worldPointFromScreen(sx, sy){
    return { x: (sx - view.panX) / view.scale, y: (sy - view.panY) / view.scale };
  }

  viewport.addEventListener("pointerdown", function(e){
    if(e.target.closest && e.target.closest("#node-toolbar")) return;
    var nodeEl = e.target.closest(".node");
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(pointers.size === 2){
      drag = null;
      var pts = Array.from(pointers.values());
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinch = {
        startDist: dist, startScale: view.scale,
        startPanX: view.panX, startPanY: view.panY,
        midX: (pts[0].x+pts[1].x)/2, midY: (pts[0].y+pts[1].y)/2
      };
      return;
    }

    if(nodeEl && nodeEl.getAttribute("contenteditable") === "true") return; // let text editing work

    if(nodeEl){
      var id = nodeEl.dataset.id;
      drag = { type:"node", id:id, startX:e.clientX, startY:e.clientY, moved:false };
      nodeEl.setPointerCapture(e.pointerId);
      nodeEl.classList.add("dragging");
    } else {
      drag = { type:"pan", startX:e.clientX, startY:e.clientY, startPanX:view.panX, startPanY:view.panY, moved:false };
      viewport.classList.add("panning");
    }
  });

  viewport.addEventListener("pointermove", function(e){
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(pinch && pointers.size === 2){
      var pts = Array.from(pointers.values());
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      var factor = dist / pinch.startDist;
      var newScale = clamp(pinch.startScale * factor, 0.2, 3);
      var worldPt = { x:(pinch.midX - pinch.startPanX)/pinch.startScale, y:(pinch.midY - pinch.startPanY)/pinch.startScale };
      view.scale = newScale;
      view.panX = pinch.midX - worldPt.x * newScale;
      view.panY = pinch.midY - worldPt.y * newScale;
      applyTransform();
      return;
    }

    if(!drag) return;
    if(drag.type === "node"){
      var dxScreen = e.clientX - drag.startX, dyScreen = e.clientY - drag.startY;
      if(Math.abs(dxScreen) > 3 || Math.abs(dyScreen) > 3) drag.moved = true;
      var dx = (e.movementX || 0) / view.scale;
      var dy = (e.movementY || 0) / view.scale;
      if(dx || dy) moveNodeLive(drag.id, dx, dy);
    } else if(drag.type === "pan"){
      var pdx = e.clientX - drag.startX, pdy = e.clientY - drag.startY;
      if(Math.abs(pdx) > 3 || Math.abs(pdy) > 3) drag.moved = true;
      view.panX = drag.startPanX + pdx;
      view.panY = drag.startPanY + pdy;
      applyTransform();
      positionNodeToolbar();
    }
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinch = null;
    if(!drag) return;
    if(drag.type === "node"){
      var el = nodesLayer.querySelector('.node[data-id="'+drag.id+'"]');
      if(el) el.classList.remove("dragging");
      if(!drag.moved){
        if(selectedId === drag.id && el && el.getAttribute("contenteditable") !== "true"){
          beginEdit(drag.id);
        } else {
          selectNode(drag.id);
        }
      } else {
        saveState();
      }
    } else if(drag.type === "pan"){
      viewport.classList.remove("panning");
      if(!drag.moved){
        selectNode(null);
      }
      saveState();
    }
    drag = null;
  }
  viewport.addEventListener("pointerup", endPointer);
  viewport.addEventListener("pointercancel", endPointer);

  nodesLayer.addEventListener("blur", function(e){
    if(e.target.classList && e.target.classList.contains("node") && e.target.getAttribute("contenteditable") === "true"){
      commitEdit(e.target);
    }
  }, true);

  nodesLayer.addEventListener("keydown", function(e){
    var el = e.target.closest && e.target.closest('.node[contenteditable="true"]');
    if(!el) return;
    if(e.key === "Enter"){ e.preventDefault(); el.blur(); }
    if(e.key === "Escape"){ e.preventDefault(); el.removeAttribute("contenteditable"); fullRender(); }
  });

  viewport.addEventListener("wheel", function(e){
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.1 : 0.9;
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive:false });

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function zoomAt(screenX, screenY, factor){
    var worldPt = worldPointFromScreen(screenX, screenY);
    view.scale = clamp(view.scale * factor, 0.2, 3);
    view.panX = screenX - worldPt.x * view.scale;
    view.panY = screenY - worldPt.y * view.scale;
    applyTransform();
    positionNodeToolbar();
    saveState();
  }

  function zoomCentered(factor){
    var r = viewport.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, factor);
  }

  function fitView(){
    var ids = Object.keys(state.nodes);
    if(ids.length === 0) return;
    var xs = ids.map(function(id){ return state.nodes[id].x; });
    var ys = ids.map(function(id){ return state.nodes[id].y; });
    var minX = Math.min.apply(null, xs) - 90, maxX = Math.max.apply(null, xs) + 90;
    var minY = Math.min.apply(null, ys) - 60, maxY = Math.max.apply(null, ys) + 60;
    var r = viewport.getBoundingClientRect();
    var scaleX = r.width / (maxX-minX || 1);
    var scaleY = r.height / (maxY-minY || 1);
    view.scale = clamp(Math.min(scaleX, scaleY), 0.2, 2);
    var cx = WC.x + (minX+maxX)/2, cy = WC.y + (minY+maxY)/2;
    view.panX = r.width/2 - cx * view.scale;
    view.panY = r.height/2 - cy * view.scale;
    applyTransform();
    positionNodeToolbar();
    saveState();
  }

  // ---------------- Mini toolbar actions ----------------
  nodeToolbar.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
  nodeToolbar.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn || !selectedId) return;
    var act = btn.dataset.act;
    if(act === "edit"){ beginEdit(selectedId); }
    else if(act === "child"){
      var id = addChild(selectedId);
      layoutTree(); fullRender(); selectNode(id); saveState();
    } else if(act === "sibling"){
      var sid = addSibling(selectedId);
      layoutTree(); fullRender(); selectNode(sid); saveState();
    } else if(act === "delete"){
      var node = state.nodes[selectedId];
      if(!node.parent){ alert("The root idea can't be deleted — try renaming it instead."); return; }
      var hasKids = node.children.length > 0;
      if(hasKids && !confirm("Delete this node and everything branching from it?")) return;
      deleteNode(selectedId);
      layoutTree(); fullRender(); saveState();
    }
  });

  // ---------------- Keyboard shortcuts ----------------
  document.addEventListener("keydown", function(e){
    var active = document.activeElement;
    var isEditing = active && active.classList && active.classList.contains("node") && active.getAttribute("contenteditable") === "true";
    if(isEditing) return;
    if(!selectedId) return;
    if(e.key === "Tab"){
      e.preventDefault();
      var id = addChild(selectedId);
      layoutTree(); fullRender(); selectNode(id); saveState();
    } else if(e.key === "Enter"){
      e.preventDefault();
      var sid = addSibling(selectedId);
      layoutTree(); fullRender(); selectNode(sid); saveState();
    } else if(e.key === "F2"){
      e.preventDefault(); beginEdit(selectedId);
    } else if(e.key === "Delete" || e.key === "Backspace"){
      var node = state.nodes[selectedId];
      if(!node.parent) return;
      e.preventDefault();
      var hasKids = node.children.length > 0;
      if(hasKids && !confirm("Delete this node and everything branching from it?")) return;
      deleteNode(selectedId);
      layoutTree(); fullRender(); saveState();
    }
  });

  window.addEventListener("resize", positionNodeToolbar);

  // ---------------- Mermaid import / export ----------------
  var SHAPE_PATTERNS = [
    { re: /^([\w-]*)\(\((.+)\)\)$/, shape: "circle" },
    { re: /^([\w-]*)\{\{(.+)\}\}$/, shape: "hexagon" },
    { re: /^([\w-]*)\)(.+)\($/,     shape: "cloud" },
    { re: /^([\w-]*)\[(.+)\]$/,     shape: "square" },
    { re: /^([\w-]*)\((.+)\)$/,     shape: "rounded" }
  ];

  function parseNodeLabel(raw){
    var trimmed = raw.trim();
    for(var i=0;i<SHAPE_PATTERNS.length;i++){
      var m = trimmed.match(SHAPE_PATTERNS[i].re);
      if(m) return { text: m[2].trim(), shape: SHAPE_PATTERNS[i].shape };
    }
    return { text: trimmed, shape: "default" };
  }

  function parseMermaidMindmap(src){
    var rawLines = src.replace(/\t/g, "    ").split(/\r?\n/);
    var lines = [];
    rawLines.forEach(function(line){
      var trimmed = line.trim();
      if(trimmed === "" || trimmed.indexOf("%%") === 0) return;
      lines.push(line);
    });
    if(lines.length && /^\s*mindmap\b/i.test(lines[0])) lines.shift();

    var nodes = {}, rootId = null, counter = 0;
    var stack = []; // {indent, id}

    lines.forEach(function(line){
      var trimmed = line.trim();
      if(trimmed.indexOf("::") === 0) return; // icon/class directive, skip
      var indent = line.length - line.replace(/^ +/, "").length;
      var parsed = parseNodeLabel(trimmed);
      var id = "n" + (counter++);
      nodes[id] = { id:id, text: parsed.text || "Untitled", shape: parsed.shape, x:0, y:0, parent:null, children:[] };

      while(stack.length && stack[stack.length-1].indent >= indent) stack.pop();

      if(stack.length === 0){
        rootId = id;
      } else {
        var parent = stack[stack.length-1];
        nodes[id].parent = parent.id;
        nodes[parent.id].children.push(id);
      }
      stack.push({ indent:indent, id:id });
    });

    if(!rootId){
      return defaultState();
    }
    if(nodes[rootId].shape === "default") nodes[rootId].shape = "circle";
    return { nodes: nodes, rootId: rootId, nextIdNum: counter };
  }

  function wrapShape(text, shape){
    switch(shape){
      case "circle": return "((" + text + "))";
      case "hexagon": return "{{" + text + "}}";
      case "cloud": return ")" + text + "(";
      case "square": return "[" + text + "]";
      case "rounded": return "(" + text + ")";
      default: return text;
    }
  }

  function exportMermaid(){
    var lines = ["mindmap"];
    function walk(id, depth){
      var node = state.nodes[id];
      var text = (node.text || "Untitled").replace(/\s+/g, " ").trim() || "Untitled";
      lines.push("  ".repeat(depth+1) + wrapShape(text, node.shape));
      node.children.forEach(function(cid){ walk(cid, depth+1); });
    }
    walk(state.rootId, 0);
    return lines.join("\n");
  }

  // ---------------- Modals ----------------
  function openModal(id){ document.getElementById(id).classList.add("show"); }
  function closeModal(id){ document.getElementById(id).classList.remove("show"); }
  document.querySelectorAll("[data-close]").forEach(function(btn){
    btn.addEventListener("click", function(){ btn.closest(".modal-backdrop").classList.remove("show"); });
  });
  document.querySelectorAll(".modal-backdrop").forEach(function(bd){
    bd.addEventListener("click", function(e){ if(e.target === bd) bd.classList.remove("show"); });
  });

  document.getElementById("btn-import").addEventListener("click", function(){
    document.getElementById("import-text").value = "";
    openModal("import-backdrop");
  });
  document.getElementById("btn-do-import").addEventListener("click", function(){
    var text = document.getElementById("import-text").value;
    if(!text.trim()) return;
    state = parseMermaidMindmap(text);
    selectedId = null;
    layoutTree();
    fullRender();
    fitView();
    saveState();
    closeModal("import-backdrop");
  });

  document.getElementById("btn-export").addEventListener("click", function(){
    document.getElementById("export-text").value = exportMermaid();
    openModal("export-backdrop");
  });
  document.getElementById("btn-copy").addEventListener("click", function(){
    var ta = document.getElementById("export-text");
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(function(){});
  });
  document.getElementById("btn-download").addEventListener("click", function(){
    var blob = new Blob([exportMermaid()], { type:"text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "mindwood.mmd";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("btn-new").addEventListener("click", function(){
    if(!confirm("Start a new map? This clears the current one.")) return;
    state = defaultState();
    selectedId = null;
    layoutTree();
    fullRender();
    fitView();
    saveState();
  });

  document.getElementById("btn-fit").addEventListener("click", fitView);
  document.getElementById("btn-relayout").addEventListener("click", function(){
    layoutTree(); fullRender(); saveState();
  });
  document.getElementById("zoom-in").addEventListener("click", function(){ zoomCentered(1.2); });
  document.getElementById("zoom-out").addEventListener("click", function(){ zoomCentered(1/1.2); });
  document.getElementById("zoom-reset").addEventListener("click", function(){
    view.scale = 1; applyTransform(); positionNodeToolbar(); saveState();
  });

  // ---------------- Init ----------------
  function init(){
    state = loadState();
    var needsLayout = Object.keys(state.nodes).every(function(id){
      var n = state.nodes[id];
      return n.x === 0 && n.y === 0 && n.id !== state.rootId;
    });
    if(needsLayout) layoutTree();
    fullRender();
    if(!view.scale || (view.panX === 0 && view.panY === 0)){
      fitView();
    } else {
      applyTransform();
    }
  }

  init();
})();
</script>
</body>
</html>
