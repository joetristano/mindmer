<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindMer — Local Maps (Static)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 0; display:flex; height:100vh; }
    .sidebar { width:320px; border-right:1px solid #ddd; padding:16px; box-sizing:border-box; overflow:auto; background:#f9f9f9; }
    .main { flex:1; padding:16px; box-sizing:border-box; display:flex; flex-direction:column; }
    .map-list { margin:8px 0; }
    .map-item { display:flex; align-items:center; justify-content:space-between; padding:6px 4px; border-bottom:1px solid #eee; }
    button { margin-left:8px; }
    textarea { width:100%; height:60vh; font-family:monospace; font-size:13px; box-sizing:border-box; }
    input[type="text"] { width:100%; box-sizing:border-box; padding:6px; }
    .muted { color:#666; font-size:13px }
    .controls { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
    .small { font-size:13px; padding:6px 8px; }
    .badge { font-size:12px; color:#555; background:#eee; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>Saved Maps <span id="count" class="badge">0</span></h3>
    <div style="display:flex;gap:8px">
      <button id="newBtn" class="small">New</button>
      <button id="migrateBtn" class="small">Migrate legacy</button>
      <button id="clearAllBtn" class="small">Clear all</button>
    </div>
    <div class="map-list" id="mapList" aria-live="polite" style="margin-top:12px"></div>

    <hr />
    <div>
      <strong>Import / Export</strong>
      <div style="margin-top:8px">
        <button id="exportBtn" class="small">Export all (.json)</button>
        <input id="importFile" type="file" accept="application/json" style="margin-top:8px" />
      </div>
    </div>
    <hr />
    <div class="muted">Storage keys: <code>mindmer:maps</code>, <code>mindmer:active</code>. Legacy key used for migration: <code>mindmer:map</code>.</div>
  </div>

  <div class="main">
    <div style="display:flex;gap:12px; align-items:center">
      <div style="flex:1">
        <input id="mapName" placeholder="Map name" />
        <div id="meta" class="muted" style="margin-top:6px">No map loaded</div>
      </div>
      <div>
        <button id="saveBtn" class="small">Save</button>
        <button id="saveAsBtn" class="small">Save as New</button>
        <button id="deleteBtn" class="small">Delete</button>
      </div>
    </div>

    <textarea id="editor" placeholder="Map data (JSON or free text). This demo stores whatever you put here."></textarea>

    <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center">
      <div class="muted">Tip: Use JSON for structured maps. localStorage quota is limited.</div>
      <div>
        <button id="importTextBtn" class="small">Import JSON into editor</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const STORAGE_KEY = 'mindmer:maps';
  const ACTIVE_KEY = 'mindmer:active';
  const LEGACY_KEYS = ['mindmer:map', 'mindmap']; // check these for migration

  // Utilities
  function generateId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.floor(Math.random()*1e9).toString(36);
  }

  function readMaps() {
    const raw = localStorage.getItem(STORAGE_KEY);
    try { return raw ? JSON.parse(raw) : {}; } catch (e) { console.warn('Failed to parse maps', e); return {}; }
  }
  function writeMaps(maps) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(maps));
  }
  function listMapsArray() {
    return Object.values(readMaps()).sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  }
  function setActiveMap(id) {
    if (!id) localStorage.removeItem(ACTIVE_KEY);
    else localStorage.setItem(ACTIVE_KEY, id);
  }
  function getActiveMapId() { return localStorage.getItem(ACTIVE_KEY); }
  function saveMap(id, data, name) {
    const maps = readMaps();
    if (!maps[id]) throw new Error('Map not found: ' + id);
    maps[id].data = data;
    if (name) maps[id].name = name;
    maps[id].updatedAt = Date.now();
    writeMaps(maps);
    setActiveMap(id);
    return maps[id];
  }
  function createMap(name = 'Untitled', data = '') {
    const maps = readMaps();
    const id = generateId();
    const now = Date.now();
    const map = { id, name, data, createdAt: now, updatedAt: now };
    maps[id] = map;
    writeMaps(maps);
    setActiveMap(id);
    return map;
  }
  function loadMap(id) {
    const maps = readMaps();
    return maps[id] || null;
  }
  function deleteMap(id) {
    const maps = readMaps();
    if (!maps[id]) return false;
    delete maps[id];
    writeMaps(maps);
    if (getActiveMapId() === id) {
      const remaining = Object.keys(readMaps());
      setActiveMap(remaining.length ? remaining[0] : null);
    }
    return true;
  }
  function clearAllMaps(confirmed = true) {
    if (confirmed && !confirm('Clear all saved maps? This cannot be undone.')) return false;
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(ACTIVE_KEY);
    return true;
  }

  // Migration
  function migrateLegacyMap() {
    const maps = readMaps();
    for (const key of LEGACY_KEYS) {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      try {
        const data = JSON.parse(raw);
        // If legacy value already looks like a new map (has id + data), skip
        if (data && data.id && data.data) continue;
        const id = generateId();
        const now = Date.now();
        maps[id] = { id, name: 'Migrated map', data, createdAt: now, updatedAt: now };
        localStorage.setItem(key + '.backup', raw);
        localStorage.removeItem(key);
        writeMaps(maps);
        setActiveMap(id);
        return { migrated: true, key, id };
      } catch (e) {
        // raw might be a plain string (non-JSON) -> store as string
        const id = generateId();
        const now = Date.now();
        maps[id] = { id, name: 'Migrated map', data: raw, createdAt: now, updatedAt: now };
        localStorage.setItem(key + '.backup', raw);
        localStorage.removeItem(key);
        writeMaps(maps);
        setActiveMap(id);
        return { migrated: true, key, id };
      }
    }
    return { migrated: false };
  }

  // UI wiring
  const mapListEl = document.getElementById('mapList');
  const countEl = document.getElementById('count');
  const mapNameEl = document.getElementById('mapName');
  const editorEl = document.getElementById('editor');
  const metaEl = document.getElementById('meta');

  function renderList() {
    const maps = listMapsArray();
    countEl.textContent = maps.length;
    mapListEl.innerHTML = '';
    if (!maps.length) {
      mapListEl.innerHTML = '<div class="muted">No maps saved</div>';
      updateEditorFromActive();
      return;
    }
    maps.forEach(m => {
      const div = document.createElement('div');
      div.className = 'map-item';
      const left = document.createElement('div');
      left.style.flex = '1';
      left.innerHTML = '<strong>' + escapeHtml(m.name) + '</strong><div class="muted" style="font-size:12px">' +
        new Date(m.updatedAt).toLocaleString() + '</div>';
      const right = document.createElement('div');
      const openBtn = document.createElement('button'); openBtn.textContent = 'Open'; openBtn.className='small';
      const delBtn = document.createElement('button'); delBtn.textContent = 'Delete'; delBtn.className='small';
      openBtn.onclick = () => { openMap(m.id); };
      delBtn.onclick = () => {
        if (!confirm('Delete "'+m.name+'"?')) return;
        deleteMap(m.id);
        renderList();
      };
      right.appendChild(openBtn); right.appendChild(delBtn);
      div.appendChild(left); div.appendChild(right);
      mapListEl.appendChild(div);
    });
    updateEditorFromActive();
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]); }); }

  function updateEditorFromActive() {
    const id = getActiveMapId();
    if (!id) {
      mapNameEl.value = '';
      editorEl.value = '';
      metaEl.textContent = 'No map loaded';
      return;
    }
    const m = loadMap(id);
    if (!m) { mapNameEl.value=''; editorEl.value=''; metaEl.textContent='No map loaded'; return; }
    mapNameEl.value = m.name || '';
    // If data is an object, pretty-print JSON
    try {
      if (typeof m.data === 'object') editorEl.value = JSON.stringify(m.data, null, 2);
      else editorEl.value = String(m.data || '');
    } catch (e) {
      editorEl.value = String(m.data || '');
    }
    metaEl.innerHTML = 'Loaded: <strong>' + escapeHtml(m.name) + '</strong> — updated ' + new Date(m.updatedAt).toLocaleString();
  }

  function openMap(id) {
    setActiveMap(id);
    renderList();
    // focus editor
    editorEl.focus();
  }

  // Buttons
  document.getElementById('newBtn').addEventListener('click', () => {
    const m = createMap('Untitled', '');
    renderList();
    openMap(m.id);
  });
  document.getElementById('saveBtn').addEventListener('click', () => {
    const id = getActiveMapId();
    if (!id) return alert('No active map to save. Click New or Open a map first.');
    let data = editorEl.value;
    // Try parse JSON so structured data stays structured
    try { data = JSON.parse(data); } catch(e) { /* keep as string */ }
    try {
      const name = mapNameEl.value || 'Untitled';
      saveMap(id, data, name);
      renderList();
      alert('Saved.');
    } catch (e) { alert('Save failed: ' + e.message); }
  });
  document.getElementById('saveAsBtn').addEventListener('click', () => {
    let data = editorEl.value;
    try { data = JSON.parse(data); } catch(e) { }
    const name = mapNameEl.value || 'Untitled';
    const m = createMap(name, data);
    renderList();
    openMap(m.id);
    alert('Saved as new map.');
  });
  document.getElementById('deleteBtn').addEventListener('click', () => {
    const id = getActiveMapId();
    if (!id) return alert('No active map to delete.');
    const m = loadMap(id);
    if (!confirm('Delete active map "' + (m && m.name || id) + '"?')) return;
    deleteMap(id);
    renderList();
  });
  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (!confirm('Clear ALL maps? This will remove everything saved.')) return;
    clearAllMaps(false);
    renderList();
  });

  document.getElementById('migrateBtn').addEventListener('click', () => {
    const res = migrateLegacyMap();
    if (res.migrated) {
      alert('Migrated legacy key ' + res.key + ' into new store (id: ' + res.id + '). Backup saved at ' + (res.key + '.backup'));
      renderList();
    } else {
      alert('No legacy map found to migrate.');
    }
  });

  // Export / Import
  document.getElementById('exportBtn').addEventListener('click', () => {
    const maps = readMaps();
    const blob = new Blob([JSON.stringify({ exportedAt:Date.now(), maps }, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'mindmer-maps-export.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = function(){ try {
        const obj = JSON.parse(r.result);
        if (!obj.maps) return alert('Invalid export file: missing maps');
        const existing = readMaps();
        const imported = obj.maps;
        // merge (overwrite by id)
        const merged = Object.assign({}, existing, imported);
        writeMaps(merged);
        alert('Imported ' + Object.keys(imported).length + ' maps. Existing maps preserved/merged.');
        renderList();
    } catch(err){ alert('Import failed: ' + err.message); } }
    r.readAsText(f);
    e.target.value = '';
  });

  document.getElementById('importTextBtn').addEventListener('click', () => {
    const t = editorEl.value.trim();
    if (!t) return alert('Editor is empty.');
    try {
      const obj = JSON.parse(t);
      editorEl.value = JSON.stringify(obj, null, 2);
      alert('Parsed JSON successfully.');
    } catch(e){ alert('Not valid JSON: ' + e.message); }
  });

  // Sync across tabs
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY || e.key === ACTIVE_KEY) {
      renderList();
    }
  });

  // Init: if no maps exist, but legacy key present, auto-suggest migration (do not auto-migrate without user click).
  function init() {
    renderList();
    // if there's an active id but the map is missing, clear active
    const active = getActiveMapId();
    if (active && !loadMap(active)) setActiveMap(null);
    updateEditorFromActive();
    // show a small hint if legacy key exists
    for (const k of LEGACY_KEYS) {
      if (localStorage.getItem(k)) {
        const migrateBtn = document.getElementById('migrateBtn');
        migrateBtn.style.background = '#ffe'; migrateBtn.title = 'Legacy map key found: ' + k;
        break;
      }
    }
  }

  init();

})();
</script>
</body>
</html>
